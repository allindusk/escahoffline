name: e2e-clean-install

# 模拟「新用户 → 下载便携包 → 解压 → 启动 → 装一部剧情 → 播放」的完整链路。
# 只在手动触发：跑一次约 8–15 分钟（含下载素材），不适合每次提交都跑。
on:
  workflow_dispatch:
    inputs:
      source:
        description: '从哪拿被测的包'
        type: choice
        required: true
        default: 'release'
        options:
          - release      # 从 Releases 下载真实发布产物（推荐）
          - build        # 在 CI 里现场组装（Release 还没发时用这个）
      unit:
        description: '装哪一部剧情（如 char_2）'
        required: false
        default: 'char_2'
      with_base:
        description: '连公共素材一起下（795 MB，用来验 BGM/背景/头像）'
        type: boolean
        required: false
        default: false
      full:
        description: '连很慢的也测（实际超分 + 导出视频，多花 10-20 分钟）'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      #  1. 拿到被测的包
      # ============================================================
      #  默认走 release：下载**真实发布产物**。
      #  为什么不能用"现场再组装一遍"代替 —— 那样测的是 CI 自己拼出来的副本，
      #  打包环节（漏文件 / 路径错 / 依赖没装全）根本没被验证。
      - name: 获取被测包
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          function Build-Portable {
            param([string]$Dst)

            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

            New-Item -ItemType Directory -Force -Path $Dst | Out-Null
            Copy-Item server, tools, docs -Destination $Dst -Recurse
            Copy-Item VERSION, README.md, NOTICE.md, LICENSE, requirements.txt, start.sh, 启动.bat -Destination $Dst
            New-Item -ItemType Directory -Force -Path "$Dst/web/data" | Out-Null
            Copy-Item web/*.html, web/serve.py -Destination "$Dst/web"
            Copy-Item web/assets -Destination "$Dst/web" -Recurse
            # 白名单：只带程序自带的索引（黑名单会把本机产物一起打包，
            # 例如 imgmap.x2.js 会让新用户看到"没有需要超分的图"）
            $INDEX = @('advindex.js', 'app.json', 'cgmap.js', 'charmeta.js',
                       'imgmap.js', 'index.js', 'names.js', 'packs.links.js',
                       'stand_layers.json')
            foreach ($f in $INDEX) {
              $s2 = Join-Path 'web/data' $f
              if (Test-Path $s2) { Copy-Item $s2 -Destination "$Dst/web/data" }
            }
            New-Item -ItemType Directory -Force -Path "$Dst/web/media", "$Dst/userdata" | Out-Null

            $pyVer = "3.11.9"
            Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip" -OutFile "dist/py.zip"
            Expand-Archive "dist/py.zip" -DestinationPath "$Dst/python" -Force

            # 关键：embeddable 自带 python*._pth，一旦存在就**接管 sys.path**，
            # 其中 "." 指 python.exe 所在目录（python\）而非项目根，
            # 于是 `python -m server` 报 "No module named server"。
            # 只取消注释 import site 没用 —— 必须删掉它，回到标准路径规则。
            Get-ChildItem "$Dst/python/python*._pth" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Remove-Item $_.FullName -Force
                Write-Host "已删除 $($_.Name)（改为标准 sys.path）"
              }

            New-Item -ItemType Directory -Force -Path "$Dst/python/Lib/site-packages" | Out-Null
            python -m pip install --quiet --upgrade --target "$Dst/python/Lib/site-packages" `
              --only-binary=:all: UnityPy lz4 Pillow numpy cryptography playwright av

            @'
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          set "PYTHONPATH=%~dp0"
          "%~dp0python\python.exe" -m server --open
          if errorlevel 1 pause
          '@ | Set-Content "$Dst/启动.bat" -Encoding oem

            & "$Dst/python/python.exe" -c "import sys, UnityPy, PIL, numpy, playwright; print('embedded ok', sys.version.split()[0])"
            if ($LASTEXITCODE -ne 0) { throw "内置 Python 环境不可用" }
            Compress-Archive -Path $Dst/* -DestinationPath dist/ESCAH-Offline-v0.0.0-win64-portable.zip -CompressionLevel Optimal
          }

          $got = $false
          if ("${{ inputs.source }}" -eq "release") {
            gh release download --pattern "*win64-portable.zip" --dir dist --clobber
            if (($LASTEXITCODE -eq 0) -and (Get-ChildItem dist/*win64-portable.zip -ErrorAction SilentlyContinue)) {
              Write-Host "已从 Releases 下载真实发布产物"
              $got = $true
            } else {
              Write-Host "::warning::Releases 里没拿到包（还没发布？），回退到现场组装"
            }
          }

          if (-not $got) {
            Build-Portable -Dst "dist/ESCAH-Offline"
          }

          Get-ChildItem dist/*win64-portable.zip | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      # ============================================================
      #  2. 解压到干净目录（模拟用户下载后的操作）
      # ============================================================
      - name: 解压到干净目录
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*win64-portable.zip | Select-Object -First 1).FullName
          "被测包: $zip"
          Remove-Item -Recurse -Force D:\e2e -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path D:\e2e | Out-Null
          Expand-Archive $zip -DestinationPath D:\e2e\ESCAH-Offline -Force
          $n = (Get-ChildItem D:\e2e\ESCAH-Offline -Recurse -File | Measure-Object).Count
          "解压后文件数: $n"
          if ($n -lt 50) { throw "解压结果异常（只有 $n 个文件）" }

      # ============================================================
      #  3. 端到端冒烟测试
      # ============================================================
      - name: 端到端冒烟测试
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          # 用**解压出来的包里自带的**解释器跑，才能验证内置环境
          $py = "D:\e2e\ESCAH-Offline\python\python.exe"
          if (-not (Test-Path $py)) { throw "包里没有内置 Python: $py" }
          & $py -c "import sys, UnityPy, PIL, numpy, playwright; print('包内环境 ok', sys.version.split()[0])"

          $extra = @()
          if ("${{ inputs.with_base }}" -eq "true") { $extra += "--base" }
          if ("${{ inputs.full }}" -eq "true") { $extra += "--full" }
          # 用**本次 checkout 的**脚本，而不是包里那份：
          # 测试脚本属于"测试工具"，若从被测物里取，就永远验不到新写的检查逻辑
          # （曾因此出现"源码已修好但 e2e 仍报旧错"的假失败）。
          # 解释器仍用包内 python —— 被测环境不变，只是工具换成最新。
          & $py tools/e2e_smoke.py `
            --dir D:\e2e\ESCAH-Offline --unit "${{ inputs.unit }}" @extra
          if ($LASTEXITCODE -ne 0) { throw "端到端测试未通过（exit $LASTEXITCODE）" }

      - name: 上传日志（失败也传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            D:\e2e\ESCAH-Offline\userdata\logs\*.log
            D:\e2e\ESCAH-Offline\userdata\cdn\*.json
          if-no-files-found: ignore
          retention-days: 7
