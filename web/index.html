<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="assets/js/shellboot.js?v=1130a"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>超昂大战 · 角色个人剧情（演出模式）</title>
<link rel="stylesheet" href="assets/css/player.css?v=1123g">
<link rel="stylesheet" href="assets/css/extras.css?v=1123a">
<!-- 「自己动手翻」教程浮窗：与资源管理页共用同一份（assets/js/trans_tut.js） -->
<link rel="stylesheet" href="assets/css/trans_tut.css?v=1103a">
<link rel="stylesheet" href="assets/css/mobile.css?v=1119a">
<!-- 悬停说明气泡（14px）：原生 title 只有 12px，低于全站字号下限 -->
<link rel="stylesheet" href="assets/css/tip.css?v=1116c">
</head>
<body>
<!-- MulColorBackground / MulStand 的调色板：CSS filter 做不了「R/G/B 各自相乘」，
     只能挂 SVG feColorMatrix。这里放一个 0 尺寸的宿主，滤镜节点由 player.js
     按需创建/回收（color-interpolation-filters=sRGB，保证和 CSS 亮度口径一致）。 -->
<svg id="mulFilters" width="0" height="0" aria-hidden="true"
     style="position:absolute;width:0;height:0;overflow:hidden"></svg>
<!-- 关闭按钮必须是面板的**兄弟节点**：面板是 overflow-y:auto 的滚动容器，
     放在里面会跟着内容滚走（以前 top:50% 相对内容高度算，一拉就看不见了） -->
<button id="setClose" title="关闭设置（Esc）" hidden>✕</button>
<div id="settings" hidden>
  <!-- 分类页签：一次只显示一类，避免点开就是一整屏滑块把人看花。
       文案复用现有 sect.* i18n key，日文界面自动跟着切。 -->
  <div id="setTabs" role="tablist">
    <button type="button" class="on" data-page="view" role="tab" data-i18n="sect.view">画面</button>
    <button type="button" data-page="play" role="tab" data-i18n="sect.play">播放/手势</button>
    <button type="button" data-page="window" role="tab" data-i18n="sect.window">文本框</button>
    <button type="button" data-page="name" role="tab" data-i18n="sect.name">话者</button>
    <button type="button" data-page="text" role="tab" data-i18n="sect.text">文本节奏</button>
    <button type="button" data-page="audio" role="tab" data-i18n="sect.audio">音量</button>
  </div>
  <!-- 画面/播放 -->
  <section class="set-page" data-page="view">
  <!-- 面板本身就是两列网格：这一节严格「一行两项」——
       画面缩放 | 播完第 5 段暂停，显示不完整立绘 | 优先使用超分图。
       立绘的尺寸/位置已全部删掉（改了只会偏离游戏原演出）。
       说明文字一律收进 title 气泡（自绘 14px 气泡，见 player.js 的 initSettingTips），不占行。 -->
  <label class="ctlrow" data-i18n="set.fit">画面缩放
    <select id="setFit">
      <option value="1x" data-i18n="opt.fit.1x">原始 1x（最清晰）</option>
      <option value="fit" data-i18n="opt.fit.fit">适应窗口（会放大）</option>
      <option value="15" data-i18n="opt.fit.15">放大 1.5x</option>
    </select>
  </label>
  <div class="row"><span title="勾选：角色剧情播完第 5 段就停住，最后一段（凌辱场景）要自己点「下一段」。&#10;不勾选：自动模式下会一路连播到第 6 段。" data-i18n-title="set.holdPart5Note" data-i18n="set.holdPart5">播完第 5 段暂停<i class="qh" aria-hidden="true">?</i></span>
    <input type="checkbox" id="setHoldPart5" checked>
  </div>
  <div class="row"><span title="约 10.7% 的特殊立绘在游戏里本身就是分层图，缺少脸部部件" data-i18n-title="set.partialNote" data-i18n="set.partial">显示不完整立绘<i class="qh" aria-hidden="true">?</i></span>
    <input type="checkbox" id="setPartial">
  </div>
  <div class="row"><span title="优先加载「资源管理」里超分生成的 img_x2 高清图；没超分过的会自动回退到原图，不会黑图" data-i18n-title="set.useX2Note" data-i18n="set.useX2">优先使用超分图<i class="qh" aria-hidden="true">?</i></span>
    <input type="checkbox" id="setUseX2" checked>
  </div>

  </section>
  <!-- 播放/手势（用户 2026-11-18 要求）：
       手机全屏的点按/滑动/工具栏行为 + 电脑上的键位。
       点按类都在触屏全屏里才有意义，鼠标点画面永远保持「暂停/继续」。 -->
  <section class="set-page" data-page="play" hidden>
  <div class="set-group" data-i18n="sect.touch">手机 / 平板（全屏时）</div>
  <label class="ctlrow" title="全屏时手指点一下画面做什么。鼠标点画面不受影响，永远是暂停/继续。" data-i18n-title="set.tapOnceNote" data-i18n="set.tapOnce">单击画面<i class="qh" aria-hidden="true">?</i>
    <select id="setTapOnce">
      <option value="bar" data-i18n="opt.tap.bar">弹出工具栏（不暂停）</option>
      <option value="next" data-i18n="opt.tap.next">下一句</option>
      <option value="pause" data-i18n="opt.tap.pause">暂停 / 继续（同时弹出工具栏）</option>
    </select>
  </label>
  <label class="ctlrow" title="两下之间间隔很短时，第二下执行这里的动作。单击的动作不会被撤销 —— 想「一点就翻句」就把单击设成下一句，这里留成暂停。选暂停/继续会同时弹出工具栏，显示多久按下面的自动隐藏走。" data-i18n-title="set.tapTwiceNote" data-i18n="set.tapTwice">连点两下<i class="qh" aria-hidden="true">?</i>
    <select id="setTapTwice">
      <option value="pause" data-i18n="opt.tap.pause">暂停 / 继续（同时弹出工具栏）</option>
      <option value="next" data-i18n="opt.tap.next">下一句</option>
      <option value="bar" data-i18n="opt.tap.bar">弹出工具栏（不暂停）</option>
      <option value="none" data-i18n="opt.tap.none">不响应</option>
    </select>
  </label>
  <label class="ctlrow" title="手指按住画面不动约半秒 = 开始快进，松手就停（和电脑上按住快捷键一样）。" data-i18n-title="set.holdNote" data-i18n="set.holdAct">长按画面<i class="qh" aria-hidden="true">?</i>
    <select id="setHoldAct">
      <option value="rush" data-i18n="opt.hold.rush">快进</option>
      <option value="off" data-i18n="opt.hold.off">不响应</option>
    </select>
  </label>
  <label class="ctlrow" title="横向滑动画面：左滑下一句、右滑上一句。手指竖着动（上下滑）不会误触发。" data-i18n-title="set.swipeNote" data-i18n="set.swipeX">左右滑动<i class="qh" aria-hidden="true">?</i>
    <select id="setSwipeX">
      <option value="off" data-i18n="opt.swipe.off">不响应</option>
      <option value="line" data-i18n="opt.swipe.line">上一句 / 下一句</option>
    </select>
  </label>
  <div class="sp" aria-hidden="true"></div>

  <div class="set-group" data-i18n="sect.fsBar">全屏工具栏</div>
  <label class="ctlrow" title="工具栏压在屏幕的哪一边。放顶部时「退出全屏」会自动让到右下角。" data-i18n-title="set.fsBarPosNote" data-i18n="set.fsBarPos">显示位置<i class="qh" aria-hidden="true">?</i>
    <select id="setFsBarPos">
      <option value="bottom" data-i18n="opt.barPos.bottom">屏幕底部</option>
      <option value="top" data-i18n="opt.barPos.top">屏幕顶部</option>
    </select>
  </label>
  <label class="ctlrow" title="工具栏弹出后多久自己收起。手机上选「不隐藏」就不用每次点两下。" data-i18n-title="set.fsBarHideNote" data-i18n="set.fsBarHide">自动隐藏<i class="qh" aria-hidden="true">?</i>
    <select id="setFsBarHide">
      <option value="2600" data-i18n="opt.barHide.2600">约 3 秒</option>
      <option value="4000" data-i18n="opt.barHide.4000">约 5 秒</option>
      <option value="0" data-i18n="opt.barHide.0">不自动隐藏</option>
    </select>
  </label>
  <div class="row" title="勾选后工具栏弹出时对话框自动往上让，长句子的最后几行不会被按钮压住；工具栏收起后对话框回到原位。" data-i18n-title="set.fsBarLiftNote">
    <span data-i18n="set.fsBarLift">弹出时上移对话框<i class="qh" aria-hidden="true">?</i></span>
    <input type="checkbox" id="setFsBarLift" checked>
  </div>
  <div class="row" title="只影响全屏时弹出的那条工具栏。至少留一组，否则弹出来是空的。" data-i18n-title="set.fsBarShowNote">
    <span data-i18n="set.fsBarShow">显示按钮<i class="qh" aria-hidden="true">?</i></span>
    <span class="kchecks">
      <label><input type="checkbox" data-bar="play" checked><span data-i18n="opt.barShow.play">播放</span></label>
      <label><input type="checkbox" data-bar="prog" checked><span data-i18n="opt.barShow.prog">进度</span></label>
      <label><input type="checkbox" data-bar="opt" checked><span data-i18n="opt.barShow.opt">选项</span></label>
    </span>
  </div>
  <div class="sp" aria-hidden="true"></div>

  <!-- 键盘那一段整块包起来：手机上（没有物理键盘）整段隐藏，页面短一半 -->
  <div class="key-group">
    <!-- 说明收进「?」气泡：角标紧跟标题，桌面悬停 / 手机点一下都会弹
         （initSettingTips 认带 title 的元素，这里让整个标题 + 角标共用一条说明） -->
    <div class="set-group" data-i18n="sect.keys" data-i18n-title="set.keysNote"
         title="点右边的按键，再在键盘上按下新的键就行；Esc 放弃。一个功能可以有好几个键（并排显示、竖线隔开，任一都能用，不是组合键），每个框都能单独改；同一个键只能给一个功能用。">键盘快捷键（电脑）<i class="qh" aria-hidden="true">?</i></div>
    <!-- 键位框由 player.js 的 syncKeyButtons() 按绑定表填（一个动作可能是好几个键，
         并排显示、竖线隔开 —— 是"任一都行"，不是组合键）。 -->
    <div class="krow"><span data-i18n="key.play">暂停 / 继续</span><span class="kkeys" data-k="play"></span></div>
    <div class="krow"><span data-i18n="key.next">下一句</span><span class="kkeys" data-k="next"></span></div>
    <div class="krow"><span data-i18n="key.prev">上一句</span><span class="kkeys" data-k="prev"></span></div>
    <div class="krow"><span data-i18n="key.rush">快进（按住）</span><span class="kkeys" data-k="rush"></span></div>
    <div class="krow"><span data-i18n="key.settings">显示设置</span><span class="kkeys" data-k="settings"></span></div>
    <div class="krow"><span data-i18n="key.fullscreen">全屏（Shift = 网页全屏）</span><span class="kkeys" data-k="fullscreen"></span></div>
    <div class="krow"><span data-i18n="key.lang">切换语言</span><span class="kkeys" data-k="lang"></span></div>
    <div class="krow"><span data-i18n="key.sidebar">收起 / 展开左侧栏</span><span class="kkeys" data-k="sidebar"></span></div>
    <div class="krow"><span data-i18n="key.hist">收起 / 展开右侧栏</span><span class="kkeys" data-k="hist"></span></div>
  </div>
  </section>
  <!-- 文本框 -->
  <section class="set-page" data-page="window" hidden>
  <!-- 排序（2026-11-19 重排）：先「长什么样」→ 再「文字怎么显示」→ 最后「多大、摆在哪」。
       位置放最后有两个理由：它要等宽/高定下来才有意义；用户也是改完外观才动位置。
       类型规则（用户 2026-11-11 要求）仍然有效：同一节里同类型控件聚在一起，
       下拉框两项一行、滑块两项一行；某类剩下奇数个时，多的那个留在左列独占一格，
       用 .sp 把下一类顶到新行，不要为了"填满"把它拉成跨两列（用户明确反对）。 -->
  <div class="set-group" data-i18n="sect.msgLook" data-i18n-title="set.peekTip" title="拖动滑块或切换下拉时，这块面板会临时变淡（方便看到画面上的变化），不是出问题，松手就恢复">外观<i class="qh" aria-hidden="true">?</i></div>
  <label class="ctlrow" title="无框模式下「背景不透明度 / 背景色」不生效：文字靠描边压在任何画面上" data-i18n-title="set.msgBoxNote" data-i18n="set.msgBox">文本框外观<i class="qh" aria-hidden="true">?</i>
    <select id="setMsgBox">
      <option value="box" data-i18n="opt.msgBox.box">有边框（默认）</option>
      <option value="soft" data-i18n="opt.msgBox.soft">无框 + 柔和底衬</option>
      <option value="bare" data-i18n="opt.msgBox.bare">无框 + 纯文字</option>
    </select>
  </label>
  <label class="ctlrow" data-i18n="set.msgBg">背景色
    <select id="setMsgBg">
      <option value="10,14,22" data-i18n="opt.bg.blue">深蓝</option>
      <option value="0,0,0" data-i18n="opt.bg.black">纯黑</option>
      <option value="22,16,34" data-i18n="opt.bg.purple">深紫</option>
      <option value="24,24,28" data-i18n="opt.bg.gray">深灰</option>
      <option value="8,24,20" data-i18n="opt.bg.green">墨绿</option>
      <option value="40,30,14" data-i18n="opt.bg.gold">暗金</option>
    </select>
  </label>
  <label class="ctlrow" data-i18n="set.msgColor">文字颜色
    <select id="setMsgColor">
      <option value="#f2f5fb" data-i18n="opt.color.white">纯白</option>
      <option value="#f5ecd8" data-i18n="opt.color.cream">米黄</option>
      <option value="#d8ecff" data-i18n="opt.color.blue">淡蓝</option>
      <option value="#ffe4ee" data-i18n="opt.color.pink">淡粉</option>
      <option value="#dcf5e0" data-i18n="opt.color.green">淡绿</option>
    </select>
  </label>
  <label class="ctlrow" data-i18n="set.font">字体
    <select id="setMsgFont">
      <option value="sans" data-i18n="opt.font.sans">黑体（默认）</option>
      <option value="serif" data-i18n="opt.font.serif">明朝（衬线）</option>
      <option value="yu" data-i18n="opt.font.yu">游黑体</option>
    </select>
  </label>
  <label class="ctlrow" data-i18n="set.align">文字对齐
    <select id="setAlign">
      <option value="left" data-i18n="opt.align.left">左对齐</option>
      <option value="center" data-i18n="opt.align.center">居中</option>
      <option value="right" data-i18n="opt.align.right">右对齐</option>
      <option value="justify" data-i18n="opt.align.justify">两端对齐</option>
    </select>
  </label>

  <div class="set-group" data-i18n="sect.msgText">文字</div>
  <label data-i18n="set.fontSize">字号 <span id="valFS">21px</span>
    <input type="range" id="setFS" min="16" max="34" value="21">
  </label>
  <label data-i18n="set.lineHeight">行距 <span id="valLH">1.62</span>
    <input type="range" id="setLH" min="120" max="220" step="5" value="162">
  </label>
  <label data-i18n="set.stroke">描边粗细 <span id="valStroke">1.2px</span>
    <input type="range" id="setStroke" min="0" max="30" step="2" value="12">
  </label>
  <label data-i18n="set.alpha">背景不透明度 <span id="valA">90%</span>
    <input type="range" id="setA" min="0" max="100" value="90">
  </label>
  <!-- 文字的水平位置：文字离框左边的距离（负值可以贴到边框上）。
       头像放对话框左上角时，用它把文字推到头像右侧，不会被挡住。 -->
  <label data-i18n="set.msgTextX" data-i18n-title="set.msgTextXNote" title="文字离文本框左边的距离。把头像放在对话框左上角时，用它把文字推到头像右边；0 是原来的位置，负数能贴到边框上">文字水平位置 <span id="valMsgTextX">14px</span><i class="qh" aria-hidden="true">?</i>
    <input type="range" id="setMsgTextX" min="-24" max="240" step="1" value="14">
  </label>

  <div class="set-group" data-i18n="sect.msgSize">大小与位置</div>
  <label data-i18n="set.msgW" data-i18n-title="set.msgWNote" title="占可用宽度的百分比。调窄以后用「水平位置」决定它停在哪一侧">宽度 <span id="valMsgW">60%</span><i class="qh" aria-hidden="true">?</i>
    <input type="range" id="setMsgW" min="40" max="100" step="2" value="60">
  </label>
  <label data-i18n="set.msgH" data-i18n-title="set.msgHNote" title="最小高度。句子长、字大时会自动往上长高，不会把字挤出画面">高度 <span id="valMsgH">150px</span><i class="qh" aria-hidden="true">?</i>
    <input type="range" id="setMsgH" min="90" max="340" step="10" value="150">
  </label>
  <label data-i18n="set.msgPos" data-i18n-title="set.msgPosNote" title="0% 贴左边、50% 居中、100% 贴右边；想「靠右但别贴死」就放 80% 左右。宽度拉到 100% 时没有可挪的余地，这一项会变灰">水平位置 <span id="valMsgPos">50%</span><i class="qh" aria-hidden="true">?</i>
    <input type="range" id="setMsgPos" min="0" max="100" step="1" value="50">
  </label>
  <label data-i18n="set.msgY" data-i18n-title="set.msgYNote" title="从画面底边往上抬多少。上限跟着「高度」自动收，拖到头也只会贴住画面顶部，不会跑到画面外">垂直位置 <span id="valMsgY">26px</span><i class="qh" aria-hidden="true">?</i>
    <input type="range" id="setMsgY" min="0" max="560" step="2" value="26">
  </label>
  </section>
  <!-- 话者 + 角色头像 -->
  <section class="set-page" data-page="name" hidden>
  <!-- 顺序：先定名条挂在哪（对齐）→ 再微调位置 → 最后才是头像（要不要、长什么样）。
       名条与头像的微调都夹在舞台内：拖到头只会贴边，不会跑出画面。 -->
  <div class="set-group" data-i18n="sect.nameBar" data-i18n-title="set.peekTip" title="拖动滑块或切换下拉时，这块面板会临时变淡（方便看到名条和头像的变化），不是出问题，松手就恢复">话者名条<i class="qh" aria-hidden="true">?</i></div>
  <label class="ctlrow" data-i18n="set.nameAlign" data-i18n-title="set.nameAlignNote" title="名字贴在文本框上沿的哪一侧。选好之后再用下面两个滑块微调">对齐<i class="qh" aria-hidden="true">?</i>
    <select id="setNameAlign">
      <option value="left" data-i18n="opt.align.left">左对齐</option>
      <option value="center" data-i18n="opt.align.center">居中</option>
      <option value="right" data-i18n="opt.align.right">右对齐</option>
    </select>
  </label>
  <div class="sp" aria-hidden="true"></div>
  <label data-i18n="set.nameX" data-i18n-title="set.nameXNote" title="在对齐位置的基础上左右微调，1px 一跳；拖到头会自动贴住画面边缘，不会跑出画面。默认 30px 是为了让名字落在左上角头像的右边">左右微调 <span id="valNameX">30px</span><i class="qh" aria-hidden="true">?</i>
    <input type="range" id="setNameX" min="-300" max="300" step="1" value="30">
  </label>
  <label data-i18n="set.nameY" data-i18n-title="set.nameYNote" title="名字条压在文本框上沿，上下微调可以把它挪到框内或框外；出画面会自动贴边">上下微调 <span id="valNameY">0px</span><i class="qh" aria-hidden="true">?</i>
    <input type="range" id="setNameY" min="-60" max="40" step="2" value="0">
  </label>

  document.addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') {
      if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
      TOUR.start(TOUR_STEPS, { key: 'escah_tour_index' });

  });
