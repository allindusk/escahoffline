<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>超昂大战 · 角色个人剧情（演出模式）</title>
<link rel="stylesheet" href="assets/css/player.css?v=1104b">
<link rel="stylesheet" href="assets/css/extras.css?v=1134a">
<!-- 「自己动手翻」教程浮窗：与资源管理页共用同一份（assets/js/trans_tut.js） -->
<link rel="stylesheet" href="assets/css/trans_tut.css?v=1103a">
<link rel="stylesheet" href="assets/css/mobile.css?v=1103b">
</head>
<body>
<!-- 关闭按钮必须是面板的**兄弟节点**：面板是 overflow-y:auto 的滚动容器，
     放在里面会跟着内容滚走（以前 top:50% 相对内容高度算，一拉就看不见了） -->
<button id="setClose" title="关闭设置（Esc）" hidden>✕</button>
<div id="settings" hidden>
  <h4 data-i18n="sect.view">画面</h4>
  <label data-i18n="set.fit">画面缩放
    <select id="setFit">
      <option value="1x" data-i18n="opt.fit.1x">原始 1x（最清晰）</option>
      <option value="fit" data-i18n="opt.fit.fit">适应窗口（会放大）</option>
      <option value="15" data-i18n="opt.fit.15">放大 1.5x</option>
    </select>
  </label>
  <div class="row"><span data-i18n="set.stand">立绘尺寸</span>
    <input type="range" id="setStand" min="70" max="110" value="100" style="width:110px">
  </div>
  <label data-i18n="set.standY">立绘纵向位置 <span id="valStandY">0px</span>
    <input type="range" id="setStandY" min="-60" max="120" step="4" value="0">
  </label>
  <label data-i18n="set.standX">立绘水平偏移 <span id="valStandX">0px</span>
    <input type="range" id="setStandX" min="-40" max="40" step="1" value="0">
  </label>
  <div style="font-size:14px;color:var(--fg3);margin:-8px 0 12px">
    <span data-i18n="set.fitNote">正值向上，负值向下（负太多会切掉头部）</span>
  </div>
  <div class="row" style="margin-top:8px"><span title="约 10.7% 的特殊立绘在游戏里本身就是分层图，缺少脸部部件" data-i18n-title="set.partialNote" data-i18n="set.partial">显示不完整立绘</span>
    <input type="checkbox" id="setPartial">
  </div>
  <div class="row"><span title="优先加载「资源管理」里超分生成的 img_x2 高清图；没超分过的会自动回退到原图，不会黑图" data-i18n-title="set.useX2Note" data-i18n="set.useX2">优先使用超分图</span>
    <input type="checkbox" id="setUseX2" checked>
  </div>

  <h4 data-i18n="sect.window">文本框</h4>
  <label data-i18n="set.msgBox">文本框外观
    <select id="setMsgBox">
      <option value="box" data-i18n="opt.msgBox.box">有边框（默认）</option>
      <option value="soft" data-i18n="opt.msgBox.soft">无框 + 柔和底衬</option>
      <option value="bare" data-i18n="opt.msgBox.bare">无框 + 纯文字</option>
    </select>
  </label>
  <div style="font-size:14px;color:var(--fg3);margin:-8px 0 12px" data-i18n="set.msgBoxNote">
    无框模式下「背景不透明度 / 背景色」不生效：文字靠描边压在任何画面上
  </div>
  <label data-i18n="set.alpha">背景不透明度 <span id="valA">90%</span>
    <input type="range" id="setA" min="0" max="100" value="90">
  </label>
  <label data-i18n="set.msgBg">背景色
    <select id="setMsgBg">
      <option value="10,14,22" data-i18n="opt.bg.blue">深蓝</option>
      <option value="0,0,0" data-i18n="opt.bg.black">纯黑</option>
      <option value="22,16,34" data-i18n="opt.bg.purple">深紫</option>
      <option value="24,24,28" data-i18n="opt.bg.gray">深灰</option>
      <option value="8,24,20" data-i18n="opt.bg.green">墨绿</option>
      <option value="40,30,14" data-i18n="opt.bg.gold">暗金</option>
    </select>
  </label>
  <label data-i18n="set.msgColor">文字颜色
    <select id="setMsgColor">
      <option value="#f2f5fb" data-i18n="opt.color.white">纯白</option>
      <option value="#f5ecd8" data-i18n="opt.color.cream">米黄</option>
      <option value="#d8ecff" data-i18n="opt.color.blue">淡蓝</option>
      <option value="#ffe4ee" data-i18n="opt.color.pink">淡粉</option>
      <option value="#dcf5e0" data-i18n="opt.color.green">淡绿</option>
    </select>
  </label>
  <label data-i18n="set.font">字体
    <select id="setMsgFont">
      <option value="sans" data-i18n="opt.font.sans">黑体（默认）</option>
      <option value="serif" data-i18n="opt.font.serif">明朝（衬线）</option>
      <option value="yu" data-i18n="opt.font.yu">游黑体</option>
    </select>
  </label>
  <label data-i18n="set.fontSize">字号 <span id="valFS">21px</span>
    <input type="range" id="setFS" min="16" max="34" value="21">
  </label>
  <label data-i18n="set.lineHeight">行距 <span id="valLH">1.62</span>
    <input type="range" id="setLH" min="120" max="220" step="5" value="162">
  </label>
  <label>对话框高度 <span id="valMsgH">150px</span>
    <input type="range" id="setMsgH" min="90" max="340" step="10" value="150">
  </label>
  <label>对话框垂直位置 <span id="valMsgY">26px</span>
    <input type="range" id="setMsgY" min="0" max="570" step="6" value="26">
  </label>
  <label data-i18n="set.stroke">描边粗细 <span id="valStroke">1.2px</span>
    <input type="range" id="setStroke" min="0" max="30" step="2" value="12">
  </label>
  <label data-i18n="set.align">文字对齐
    <select id="setAlign">
      <option value="left" data-i18n="opt.align.left">左对齐</option>
      <option value="center" data-i18n="opt.align.center">居中</option>
      <option value="right" data-i18n="opt.align.right">右对齐</option>
      <option value="justify" data-i18n="opt.align.justify">两端对齐</option>
    </select>
  </label>
  <label data-i18n="set.msgX">水平位移 <span id="valMsgX">0px</span>
    <input type="range" id="setMsgX" min="-300" max="300" step="5" value="0">
  </label>
  <h4 data-i18n="sect.name">话者名</h4>
  <label data-i18n="set.nameAlign">对齐
    <select id="setNameAlign">
      <option value="left" data-i18n="opt.align.left">左对齐</option>
      <option value="center" data-i18n="opt.align.center">居中</option>
      <option value="right" data-i18n="opt.align.right">右对齐</option>
    </select>
  </label>
  <label data-i18n="set.nameX">水平位移 <span id="valNameX">0px</span>
    <input type="range" id="setNameX" min="-300" max="300" step="5" value="0">
  </label>
  <label data-i18n="set.nameY">垂直位移 <span id="valNameY">0px</span>
    <input type="range" id="setNameY" min="-60" max="40" step="2" value="0">
  </label>

  <h4 data-i18n="sect.text">文本节奏</h4>
  <label data-i18n="set.textMode">显示方式
    <select id="setTextMode">
      <option value="type" data-i18n="opt.textMode.type">打字机逐字</option>
      <option value="instant" data-i18n="opt.textMode.instant">立即显示整句</option>
    </select>
  </label>
  <label data-i18n="set.typeSpeed">打字速度 <span id="valType">100%</span>
    <input type="range" id="setType" min="30" max="300" value="100">
  </label>
  <label data-i18n="set.pausePerChar">每字停留（无配音时） <span id="valPpc">90ms</span>
    <input type="range" id="setPpc" min="30" max="260" step="10" value="90">
  </label>
  <label data-i18n="set.pauseBase">整句基础停顿 <span id="valPb">400ms</span>
    <input type="range" id="setPb" min="0" max="1600" step="50" value="400">
  </label>
  <label data-i18n="set.pauseAfterVoice">语音结束后停顿 <span id="valPav">250ms</span>
    <input type="range" id="setPav" min="0" max="1200" step="50" value="250">
  </label>

  <h4 data-i18n="sect.audio">音量</h4>
  <label data-i18n="set.bgm">BGM 音量 <span id="valBgm">70%</span>
    <input type="range" id="setBgm" min="0" max="100" value="70">
  </label>
  <label data-i18n="set.se">音效音量 <span id="valSe">90%</span>
    <input type="range" id="setSe" min="0" max="100" value="90">
  </label>
  <label data-i18n="set.voice">语音音量 <span id="valVoice">100%</span>
    <input type="range" id="setVoice" min="0" max="100" value="100">
  </label>
  <div class="reset-row"><button id="btnReset" data-i18n="ctrl.reset">恢复默认</button></div>
  </div>
<div class="layout">
  <aside id="sidebar">
    <div id="sHead"><span data-i18n="sidebar.title">剧情列表</span>
      <button id="sToggle" title="收起/展开左侧栏（[）">收起 ◂</button></div>
    <input id="search" placeholder="角色名 / ID…" autocomplete="off" data-i18n-ph="search.ph">
    <div id="srcRow">
      <button data-src="char" class="on" data-i18n="src.char">角色</button>
      <button data-src="main" data-i18n="src.main">主线</button>
      <button data-src="event" data-i18n="src.event">活动</button>
      <button data-src="other" data-i18n="src.other">其他</button>
    </div>
    <div id="filters">
      <select id="sortBy">
        <option value="id" data-i18n="sort.id">按角色 ID</option>
        <option value="name" data-i18n="sort.name">按名字（あいうえお）</option>
        <option value="date-desc" data-i18n="sort.dateDesc">实装日期 新→旧</option>
        <option value="date-asc" data-i18n="sort.dateAsc">实装日期 旧→新</option>
      </select>
      <select id="dlFilter" title="筛选：资源状态 / 收藏">
        <option value="">全部剧情</option>
        <option value="have">只看已下载</option>
        <option value="miss">只看未下载</option>
        <option value="fav">只看已收藏</option>
      </select>
      <div class="rar-row">
        <button data-r="SSR">SSR</button>
        <button data-r="SR">SR</button>
        <button data-r="R">R</button>
        <!-- 第四格：播放记录。点一下左侧列表换成"最近看过什么"，按时间倒序，
             点任意一条就回到上次看到的那一句（原来这里只有三个稀有度按钮）。 -->
        <button data-f="hist" title="播放记录：最近看过的剧情，点一下就接着上次的位置看">播放记录</button>
      </div>
    </div>
    <div id="hit"></div>
    <div id="charList"></div>
  </aside>
  <main>
    <div id="tabs"><div id="meta"></div><div id="tabStrip"></div><button id="tabPrev" class="tabPg" data-d="-1" title="上一组段">◀</button><button id="tabNext" class="tabPg" data-d="1" title="下一组段">▶</button></div>
    <div id="mainBody">
    <div id="stageWrap">
      <div id="dbgFit"></div>
      <div id="stage">
        <div id="bgLayer"></div>
        <div id="standLayer"></div>
        <div id="cgLayer"></div>
        <div id="fxLayer"></div>
        <div id="placeLayer"><span></span></div>
        <div id="flashLayer"></div>
        <div id="msgWindow">
          <div id="msgName"></div>
          <div id="msgText"></div>
        </div>
        <div id="empty" data-i18n="empty.hint">从左侧选择角色，然后点击播放</div>
      </div>
    </div>
    <aside id="history">
      <div id="hHead"><span data-i18n="history.title">本段文本 <b id="hCount"></b></span>
        <button id="hToggle" data-i18n="history.collapse">收起 ▸</button></div>
      <div id="hList"></div>
      <div id="hPager"></div>
    </aside>
    </div>
    <!-- 控制条按"用得多 → 用得少、从中间往两边"排：
         左 = 播放三连（重播/播放暂停/下一段），主体操作挨在一起；
         中 = 进度条 + 段信息（都是"现在到哪了"，必须贴在一起，进度条弹性占满）；
         右 = 播放参数（倍速/自动）→ 显示（对话框/全屏）→ 工具（翻译/设置/快捷键）。
         原来进度条只有 120px 缩在最右角落、段信息占着中间半屏，非常别扭。 -->
    <div id="controls">
      <div class="grp gPlay">
        <button id="btnRestart" data-i18n="ctrl.restart">⏮ 重播</button>
        <button id="btnPlay" class="primary">▶ 播放</button>
        <button id="btnNext" data-i18n="ctrl.nextPart">下一段 ⏭</button>
      </div>
      <div class="grp gProgress">
        <div id="progress"><i></i></div>
        <div id="pinfo"></div>
      </div>
      <div class="grp gOpt gOptA">
        <label class="ctl" data-i18n="ctrl.speed">倍速
          <select id="speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
          </select>
        </label>
        <label class="ctl"><input type="checkbox" id="auto" checked><span data-i18n="ctrl.auto">自动</span></label>
        <span class="vsep"></span>
        <button id="btnWin" data-i18n="ctrl.win" title="显示/隐藏对话框">对话框</button>
        <button id="btnFs" title="全屏 (F)">⛶ 全屏</button>
      </div>
      <!-- 翻译 / 设置 / 快捷键 一组：竖屏时它们是第四行，版本与免责是第五行。
           分组固定下来，按钮位置就不会随屏幕宽度飘来飘去。 -->
      <div class="grp gOpt gOptB">
        <button id="btnTrans" title="导出本剧情原文给 AI 翻译，或把译好的 txt 导回">翻译</button>
        <button id="btnSet" data-i18n-title="ctrl.settings" title="显示设置 (S)">⚙</button>
        <!-- 快捷键提示原来是一整句占半屏的文字，把进度条挤到了角落；改成最右边的「?」，悬停看全句 -->
        <button id="btnKeys" class="qbtn" data-i18n-title="ctrl.hotkeys"
                title="空格/P/点画面 暂停 · 回车/↓→ 下一句 · ↑← 上一句 · 按住 K 快进">?</button>
      </div>
    </div>
    <div id="dbg">调试</div>
  </main>
</div>
<div id="hTab" data-i18n="history.tab">文本列表</div>
<div id="sTab" data-i18n="sidebar.tab">剧情列表</div>
<div id="toast"></div>
<script src="data/names.js"></script>
<script src="data/charmeta.js"></script>
<script src="data/index.js"></script>
<script src="data/advindex.js"></script>
<!-- 数据映射表。必须带版本号：imgmap.js 由 gen_imgmap.py 在装完剧情后重新生成，
     不带版本号会被浏览器一直用旧缓存（表现为头像/立绘明明有了却找不到） -->
<script src="data/imgmap.js?v=1029a"></script>
<!-- 这两个是**可选覆盖层**（超分记录 / WebP 覆盖），不存在属正常，仅静默失败 -->
<script src="data/imgmap.x2.js?v=1029a"
        onerror="window.__IMGX2=window.__IMGX2||{}"></script>
<script src="data/imgmap.base.js?v=1029a"
        onerror="window.__IMGBASE=window.__IMGBASE||{}"></script>
  <!-- 音频映射是运行时产物：没装公共素材时不存在，属正常，静默失败 -->
  <script src="data/sfxmap.js?v=1029a"
          onerror="window.__SFX=window.__SFX||{}"></script>
<script src="assets/js/common.js?v=1103a"></script>
<script src="assets/js/header.js?v=1142a"></script>
<script src="assets/js/i18n.js?v=1102a"></script>
<script src="assets/js/packstate.js?v=1103a"></script>
<!-- 收藏夹 / 播放进度 / 设置：与 CG 页共用同一份 localStorage（assets/js/userdata.js） -->
<script src="assets/js/userdata.js?v=1105a"></script>
<script src="assets/js/player.js?v=1105b"></script>
<script src="assets/js/trans_tut.js?v=1133b"></script>
<script src="assets/js/transui.js?v=1136a"></script>
<script src="assets/js/tour.js?v=1102a"></script>
<script src="assets/js/disclaimer.js?v=1102a"></script>
<script src="assets/js/health.js?v=1101a"></script>
<script src="assets/js/mobile.js?v=1103a"></script>
<script>
/* 本页的新手引导步骤（tour.js 是通用引擎，步骤由页面自己定义） */
const TOUR_STEPS = [
  { el: 'nav a[href="setup.html"]', title: '① 先装素材，不然没东西可看',
    text: '这个程序<b>不带游戏的图片和声音</b>。先去「资源管理」点「下载基础数据」'
      + '（背景、音乐这些所有剧情共用的），再挑一部想看的装上。'
      + '没装的剧情会标着「未下载」。' },
  { el: '#filters', title: '② 想找哪部就搜哪部',
    text: '名字记不全也没关系：输一两个字就行。上面两个框可以换排列顺序、'
      + '只看装好的 / 没装的 / <b>已收藏</b>的；SSR / SR / R 那排是按稀有度挑。'
      + '最右边那个「<b>播放记录</b>」点一下，左边会列出你看过的剧情，'
      + '一条点回去就接着上次看到的地方。' },
  { el: '#srcRow', title: '③ 剧情分四类',
    text: '<b>角色</b>是每个人的单独故事；<b>主线 / 活动 / 其他</b>是大家共有的章节。'
      + '「其他」里已经按游戏里的入口分好组（打 BOSS、愚人节、周年庆那些），'
      + '点组名展开就能看到每一话。' },
  { el: '#sHead', title: '④ 列表能收起来',
    text: '想看得宽敞点，点这个「收起」（或按键盘上的 <b>[</b>），左边列表就收起来了，'

  { el: '#charList', title: '⑤ 点一下就播',
    text: '左边点角色、或者「其他」里点具体某一话，立刻开始播，不用再找播放键。'
      + '播的时候<b>用鼠标点一下画面就能暂停</b>。' },
  { el: '#tabs', title: '⑥ 这一段 / 下一段',
    text: '一部剧情分好几段，点这里换段。段太多一行放不下时，右边会出现 <b>◀ ▶</b> 让你翻；'

  { el: '#stage', title: '⑦ 剧情就演在这块',
    text: '画面、说话的人、台词都在这块。最常用的三个键：<b>空格</b>暂停、'
      + '<b>回车</b>下一句、按住 <b>K</b> 快进。' },
  { el: '#controls', title: '⑧ 底下一排按钮',
    text: '左边三个是重播、播放/暂停、下一段；中间那条是进度，'
      + '<b>想往后看就直接点进度条</b>，会跳到那个位置（暂停时只跳过去、不会自己播）；'
      + '右边是倍速、自动、对话框、全屏、翻译和设置。' },
  { el: '#btnKeys', title: '⑨ 快捷键记不住就看这里',
    text: '最右边这个「<b>?</b>」点一下，会把所有快捷键列出来，看一眼就会。'
      + '点别处、或者按 <b>Esc</b> 就关掉。' },
  { el: '#btnTrans', title: '⑩ 想把台词变成中文',
    text: '点「翻译」先导出这部剧的日文原文，把文件交给 AI（比如让我翻），'
      + '翻好之后再导回来，播放器里就显示中文了。' },
  { el: '#btnSet', title: '⑪ 字太小、界面不合适',
    text: '点 ⚙ 可以调字号、行距、对话框的样子、立绘大小、音量和说话速度。'
      + '改完立刻生效，下次打开还记得。' },
  { el: '#btnLan', title: '⑫ 手机上也想看',
