name: wiki-daily

# 每天抓一次公开 Wiki（escalationheroines.wikiru.jp）的角色信息，把
# server/cdn/data/char_meta.json + web/data/charmeta.js 提交回仓库。
#
# 客户端「更新角色信息」按钮从 GitHub raw 拉这个 char_meta.json —— 国内普通网络
# 即可访问，用户侧**不需要代理**（只有 GitHub 也拿不到时才退回直连 Wiki）。
#
# 只请求 2 个页面（角色一览 + ?サポーター），稀有度取自页面分节标题，
# 不逐页抓 439 个子页面。

on:
  schedule:
    - cron: '17 19 * * *'      # UTC 19:17 = 日本时间 04:17
  workflow_dispatch: {}         # 也支持手动触发

permissions:
  contents: write

concurrency:
  group: wiki-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 Wiki 角色信息
        env:
          PYTHONUTF8: '1'
        run: python tools/scrape_wiki.py

      - name: 重建 charmeta.js
        env:
          PYTHONUTF8: '1'
        run: python server/cdn/scripts/gen_charmeta.py

      - name: 有变化才提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/cdn/data/char_meta.json web/data/charmeta.js
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore(data): 每日刷新 Wiki 角色信息"
            git push
          fi
