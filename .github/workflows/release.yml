name: build-release

# 什么时候跑：
#   · 推 `v*` 标签 → 自动构建并**发 Release**（portable + update 两个 zip）
#   · Actions 页面点 Run workflow → 只构建，产物在本次运行的 Artifacts 里，
#     不建 Release（想发正式版就走 tag）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write        # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if (-not $v) { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$v"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------- 基本自检：语法不通就别发 ----------------
      - name: 安装运行依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import UnityPy, lz4, PIL, numpy; print('deps ok')"

      - name: 后端导入自检
        shell: pwsh
        run: |
          python -c "import server.api, server.media, server.exports, server.updater, server.packs, server.net, server.jobs, server.cdn.install, server.cdn.manifest, server.cdn.stages"
          if ($LASTEXITCODE -ne 0) { throw "server 包导入失败" }

      - name: 前端语法自检
        shell: pwsh
        run: |
          node --version
          $bad = 0
          Get-ChildItem web/assets/js/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL $($_.Name)"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad 个前端脚本语法错误" }

      - name: 资源清单自检
        shell: pwsh
        run: |
          # 仓库里没有素材，必然报"文件不存在"，这里只校验脚本能跑通
          python tools/build_packs.py --check-only
          Write-Host "（缺素材时校验会失败，属预期，不阻断构建）"
        continue-on-error: true

      # 构建时从公开 Wiki 抓取角色类型/稀有度，写进 char_meta.json 并重建 charmeta.js。
      # Wiki 在日本、需代理，CI runner 多半没代理 → 失败就跳过，用仓库已提交的元信息。
      - name: 刷新 Wiki 角色信息（可选，需代理）
        shell: pwsh
        continue-on-error: true
        run: |
          python tools/scrape_wiki.py
          python server/cdn/scripts/gen_charmeta.py
          Write-Host "（无法访问 Wiki 时跳过，使用仓库内已提交的 char_meta 生成）"

      # ---------------- 组装程序目录 ----------------
      # 拷贝清单 + 索引白名单 + 硬自检都在 tools/pack_app.ps1 里，与 e2e 共用一份。
      # 以前两处各写一遍，收紧白名单时改了两处还漏了 .gitkeep/自检，
      # 于是「现场组装」的包与真发布的包不是同一个东西，e2e 结论不可信。
      - name: 组装程序目录
        shell: pwsh
        run: |
          pwsh tools/pack_app.ps1 -Dst dist/ESCAH-Offline -Repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "程序目录组装失败" }

      # 纯代码更新包：只含程序与文档，不含 Python / 依赖 / 素材。
      # 程序内「检查程序更新」下的是它（3–5 MB），更新器按白名单覆盖即可。
      - name: 组装更新包（纯代码）
        shell: pwsh
        run: |
          $src = "dist/ESCAH-Offline"
          $dst = "dist/ESCAH-Offline-update"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$dst/web" | Out-Null

          Copy-Item "$src/server", "$src/tools", "$src/docs" -Destination $dst -Recurse
          # 超分引擎连同模型约 80 MB，不进「纯代码更新包」（3–5 MB 那个）
          Remove-Item "$dst/tools/realcugan" -Recurse -Force -ErrorAction SilentlyContinue
          # **不带启动脚本**：便携版的 启动.bat 是下面那步专门生成的（直接调 python\python.exe），
          # 而仓库里这份是"找系统 Python"的源码版。一旦被更新包覆盖，
          # 便携版用户下次启动就会报"没有找到 Python"。
          Copy-Item "$src/VERSION", "$src/README.md", "$src/NOTICE.md", "$src/LICENSE",
                    "$src/start.sh" -Destination $dst
          # 注意：**不能**写 `Copy-Item "$src/web" -Filter *.html -Destination ...`
          # —— -Filter 只作用于 -Path 的子项，而 -Path 是目录本身，PowerShell 会
          # 把整个 web 目录拷进 $dst/web（生成 web/web/），html 一个都进不来。
          # 实测 v1.0.0–v1.0.2 的 update 包里**没有任何 .html**，前端改动一直没送达。
          Get-ChildItem "$src/web" -Filter *.html -File |
            Copy-Item -Destination "$dst/web"
          # 调试脚本（serve.py / stop_server.ps1 / dev-*.bat）不进更新包
          Copy-Item "$src/web/assets" -Destination "$dst/web" -Recurse
          # i18n 是用户自己攒的译文（属于用户数据），更新包里不带，
          # 否则会把用户后来的翻译覆盖回发布时的旧版
          Remove-Item "$dst/web/assets/i18n" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$src/web/data" -Destination "$dst/web" -Recurse   # 只有索引，没有剧情正文

          $n = (Get-ChildItem $dst -Recurse -File | Measure-Object).Count
          "更新包内容：$n 个文件"


      # ---------------- 超分引擎：Real-CUGAN (ncnn/Vulkan) ----------------
      # 「全量包」必须自带超分引擎，否则用户只能拿到内置 Lanczos（纯插值，
      # 2 倍只是像素变多、不增细节）。
      # 用的就是本地那条已验证的链路：realcugan-ncnn-vulkan，
      # 参数与 _manifest_analysis/_scripts/sr.py 一致（-m models-se -n 2 -s 2）。
      # 位置很关键：必须在**打包更新包之后**做，否则 ~80 MB 的模型会被塞进
      # 那个本来只有 3–5 MB 的纯代码更新包。
      - name: 内置超分引擎（Real-CUGAN）
        shell: pwsh
        run: |
          $dst = "dist/ESCAH-Offline/tools/realcugan"
          $zip = "_tools/realcugan-ncnn-vulkan-windows.zip"
          if (-not (Test-Path $zip)) {
            # 项目里那份在 _tools/ 下但不入库，CI 现下同一版本（20220728）
            $zip = "dist/realcugan.zip"
            $url = "https://github.com/nihui/realcugan-ncnn-vulkan/releases/download/20220728/realcugan-ncnn-vulkan-20220728-windows.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
          }
          Expand-Archive $zip -DestinationPath "dist/realcugan" -Force
          $exe = Get-ChildItem "dist/realcugan" -Recurse -Filter "realcugan-ncnn-vulkan.exe" |
                   Select-Object -First 1
          if (-not $exe) { throw "压缩包里没找到 realcugan-ncnn-vulkan.exe" }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item (Join-Path $exe.Directory.FullName "*") $dst -Recurse -Force
          if (-not (Test-Path "$dst/realcugan-ncnn-vulkan.exe")) {
            throw "超分引擎没有正确放进包内"
          }
          if (-not (Test-Path "$dst/models-se")) { throw "超分模型目录缺失（models-se）" }
          $mb = [math]::Round(((Get-ChildItem $dst -Recurse -File |
                   Measure-Object Length -Sum).Sum / 1MB), 1)
          "Real-CUGAN 已内置：$mb MB"

      # ---------------- 便携版：内置 Python + Pillow ----------------
      - name: 组装便携版（embedded Python）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pyVer = "3.11.9"
          $src = "dist/ESCAH-Offline"
          $dst = "dist/ESCAH-Offline-portable"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item $src $dst -Recurse

          # 官方 embeddable 包：无 pip、体积小，正好适合"解压即用"
          $url = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "dist/py.zip"
          Expand-Archive "dist/py.zip" -DestinationPath "$dst/python" -Force

          # embeddable 版默认不加载 site-packages，要手动打开
          # 关键：embeddable 版自带 python*._pth，一旦存在就会**接管 sys.path**，
          # 其中 "." 指的是 python.exe 所在目录（python\），而不是项目根，
          # 于是 `python -m server` 报 "No module named server"。
          # 只取消注释 import site 没用 —— 必须把这个文件删掉，回到标准路径规则。
          Get-ChildItem "$dst/python/python*._pth" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Remove-Item $_.FullName -Force
              Write-Host "已删除 $($_.Name)（改为标准 sys.path）"
            }

          # 用 runner 上的 3.11 装全部运行依赖，ABI 与 embeddable 一致。
          # 这一步是整个便携版的关键：解包 Unity 资源需要 UnityPy + lz4 + numpy，
          # 缺任何一个用户都会卡在"安装剧情"这一步。
          New-Item -ItemType Directory -Force -Path "$dst/python/Lib/site-packages" | Out-Null
          python -m pip install --quiet --upgrade --target "$dst/python/Lib/site-packages" `
            --only-binary=:all: UnityPy lz4 Pillow numpy cryptography playwright av

          # 便携版的启动脚本：直接用内置解释器
          @'
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          rem PYTHONPATH 指向本目录：确保能找到 server 包
          set "PYTHONPATH=%~dp0"
          "%~dp0python\python.exe" -m server --open
          if errorlevel 1 pause
          '@ | Set-Content "$dst/启动.bat" -Encoding oem

          # 验证内置解释器 + 全部依赖都能跑（这是便携版唯一的验收点）
          & "$dst/python/python.exe" -c "import sys, UnityPy, lz4, PIL, numpy, playwright; print('embedded python', sys.version.split()[0], '| UnityPy', UnityPy.__version__, '| Pillow', PIL.__version__, '| numpy', numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "便携版 Python 环境不可用（解包依赖缺失）" }

          # 关键自检：**在项目根能 import server**。
          # 若 embeddable 的 ._pth 没删干净，`python -m server` 会报
          # "No module named server"，用户双击 启动.bat 直接失败。
          # 在这里拦下，避免把起不来的包发出去。
          # 注意：Push-Location 之后当前目录变了，$dst 是相对路径会找不到，
          # 所以**先取绝对路径**再切换目录（上一版就是踩了这个坑导致构建中止）。
          $pyExe = (Resolve-Path "$dst/python/python.exe").Path
          Push-Location $dst
          & $pyExe -c "import server; print('import server ok')"
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "便携包自检失败：找不到 server 包（._pth 未删除？）" }

      - name: 打 portable + update zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist/ESCAH-Offline-portable/* -DestinationPath "dist/ESCAH-Offline-v$v-win64-portable.zip" -CompressionLevel Optimal
          Compress-Archive -Path dist/ESCAH-Offline-update/* -DestinationPath "dist/ESCAH-Offline-v$v-update.zip" -CompressionLevel Optimal
          Get-ChildItem dist/*.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      # ---------------- 发布 ----------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ESCAH-Offline-v${{ steps.ver.outputs.version }}
          # 明确两个成品：不要 dist/py.zip（那是下载的 embedded Python 原始压缩包）
          path: |
            dist/ESCAH-Offline-v${{ steps.ver.outputs.version }}-win64-portable.zip
            dist/ESCAH-Offline-v${{ steps.ver.outputs.version }}-update.zip

      # ---------------- 发布 ----------------
      # 注意：本 workflow 是**手动触发**，github.ref 是 refs/heads/main，
      # 不是 refs/tags/v…。所以不能用 "if: startsWith(github.ref,'refs/tags/v')"
      # 那种条件（会永远跳过，产物只进 Artifacts，Releases 里没有文件）。
      # 这里改用 gh CLI，按 VERSION 里的版本号打 tag 并发 Release；
      # 若该版本的 Release 已存在，就覆盖上传其中的附件。
      # 说明文案放在 docs/release-notes.md（模板，{VERSION} 为占位符）。
      # 不要写进 YAML 的 PowerShell here-string：那里反引号是转义字符，
      # Markdown 里的 `userdata/` 会被当成 Unicode 转义序列，直接把构建搞挂。
      - name: 准备 Release 说明
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $tpl = Get-Content docs/release-notes.md -Raw
          Set-Content dist/notes.md -Value ($tpl -replace '\{VERSION\}', $v) -Encoding UTF8
          "已生成 dist/notes.md（v$v）"

      - name: 发布到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $tag = "v$v"
          # 明确只发这两个成品（排除 dist/py.zip：那是 embedded Python 的原始压缩包）
          $files = @(
            "dist/ESCAH-Offline-v$v-win64-portable.zip",
            "dist/ESCAH-Offline-v$v-update.zip"
          ) | Where-Object { Test-Path $_ }

          # 打 tag（已存在就忽略错误）
          git tag $tag 2>$null
          git push origin $tag 2>$null

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖上传附件"
            gh release upload $tag $files --clobber
          } else {
            Write-Host "创建 Release $tag"
            gh release create $tag $files --title "v$v" --notes-file dist/notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "发布 Release 失败" }
          gh release view $tag
