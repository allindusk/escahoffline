name: build-release

# ============================================================================
# 触发与「打包什么」—— 2026-11-02 改成按版本号触发，别改回 push tags
# ============================================================================
# 唯一判据是 VERSION 里的版本号，不是 tag：
#   · push 到 main 但没动 VERSION → **不触发，连一次运行都不创建**（on.push.paths 过滤）
#     注意 paths 比的是「这次 push 全部提交的合计 diff」，不是最后一个提交，
#     所以一次推 5 个 commit、其中某个改了 VERSION 也会触发。
#   · push 到 main 且动过 VERSION → gate 再看一眼 tag：v<ver> 已发布就跳过，否则打包
#   · Actions 页面 Run workflow   → 总是打包（publish 关掉就只出 Artifacts）
#
# **打包内容 = 这次运行的 HEAD（main 最新），不是某个 tag 的快照。**
# 旧机制是 `push: tags: v*` 触发，checkout 默认检出 tag 指向的那个提交，于是
# "打完 tag 之后又 push 的修复"永远进不了同版本的包 —— v1.0.4 的 tag 停在
# 9c930ef，其后 main 上还有 3 个提交，任何一次重跑都只会打出旧代码。
# 现在改为按版本号闸门 + 取最新 HEAD，"先推代码、再推版本号"两次 push 也
# 不会漏：后一次打包的是 main 的 HEAD，前一次的提交已经在里面。
#
# 发完版会把 tag **强制对齐**到这次构建用的提交，保证
# `git checkout v<ver>` 与包里的代码是同一份（以前 tag 已存在就静默失败，
# tag 指针与包内容不一致，每次都要被问"包里的文件是不是旧的"）。
#
# 注意：VERSION 不变就不会重发同版本 —— 程序内的更新检查只比较 tag 号
# （server/updater.py 的 `_ver_tuple`），同版本覆盖附件对老用户没有意义。
# 热修请 bump VERSION；手动 Run workflow 重发同版本只对之后新下载的人生效。

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后发布到 Release（关掉则只上传 Artifacts，不动已有 Release）'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'VERSION'        # 不动版本号的提交不该跑 CI，GitHub 直接在事件层就过滤掉

permissions:
  contents: write        # 创建/更新 Release 与推送 tag 需要

# 两次运行绝不并行改同一个 Release；后到的排队等前一次发完。
# 不要 cancel-in-progress：会把正在发的版掐成半截（附件少一个）。
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 闸门：几秒钟的 Linux job，先回答「这个版本要不要打包」
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      reason: ${{ steps.gate.outputs.reason }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # 要看到已有 tag，判断这个版本号发过没有

      - id: gate
        shell: bash
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          if [ -z "$v" ]; then v="0.0.0"; fi
          tag="v$v"
          head=$(git rev-parse HEAD)

          # 走到这里说明「VERSION 被动过」或「手动触发」（paths 过滤已经挡掉了其余情况），
          # 这里只处理一个边界：版本号撞上已发布的 tag（比如把 VERSION 改回旧值），
          # 别去覆盖一个已经发出去的版本。
          build=false
          reason=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build=true
            reason="手动触发（Run workflow），版本 $v"
          elif git rev-parse -q --verify "refs/tags/$tag" > /dev/null 2>&1; then
            reason="tag $tag 已存在 → 不覆盖已发布版本（真要重打同版本请 Run workflow）"
          else
            build=true
            reason="VERSION 动过且 $tag 尚未发布 → 打包 $v"
          fi

          echo "构建来源提交：$head"
          echo "结论：build=$build（$reason）"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: 说明
        shell: bash
        run: |
          if [ "${{ steps.gate.outputs.build }}" != "true" ]; then
            echo "::notice::本次不打包：${{ steps.gate.outputs.reason }}"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      # 不指定 ref：push 事件就是这次推送的 HEAD，手动触发就是所选分支的 HEAD。
      # 这正是「用仓库里的最新文件打包」—— 别再写成检出某个 tag。
      - uses: actions/checkout@v7

      - name: 构建来源
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $sub = (git log -1 --format='%s').Trim()
          Write-Host "事件：${{ github.event_name }}｜闸门理由：${{ needs.gate.outputs.reason }}"
          Write-Host "提交：$sha  $sub"
          Write-Host "版本：${{ needs.gate.outputs.version }}"

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw -Encoding UTF8).Trim()
          if (-not $v) { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$v"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------- 基本自检：语法不通就别发 ----------------
      - name: 安装运行依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import UnityPy, lz4, PIL, numpy; print('deps ok')"

      - name: 后端导入自检
        shell: pwsh
        run: |
          python -c "import server.api, server.media, server.exports, server.updater, server.packs, server.net, server.jobs, server.cdn.install, server.cdn.manifest, server.cdn.stages"
          if ($LASTEXITCODE -ne 0) { throw "server 包导入失败" }

      - name: 前端语法自检
        shell: pwsh
        run: |
          node --version
          $bad = 0
          Get-ChildItem web/assets/js/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL $($_.Name)"; $bad++ }
          }
          if ($bad -gt 0) { throw "$bad 个前端脚本语法错误" }

      - name: 资源清单自检
        shell: pwsh
        run: |
          # 仓库里没有素材，必然报"文件不存在"，这里只校验脚本能跑通
          python tools/build_packs.py --check-only
          Write-Host "（缺素材时校验会失败，属预期，不阻断构建）"
        continue-on-error: true

      # 构建时从公开 Wiki 抓取角色类型/稀有度，写进 char_meta.json 并重建 charmeta.js。
      # Wiki 在日本、需代理，CI runner 多半没代理 → 失败就跳过，用仓库已提交的元信息。
      - name: 刷新 Wiki 角色信息（可选，需代理）
        shell: pwsh
        continue-on-error: true
        run: |
          python tools/scrape_wiki.py
          python server/cdn/scripts/gen_charmeta.py
          Write-Host "（无法访问 Wiki 时跳过，使用仓库内已提交的 char_meta 生成）"

      # ---------------- 组装程序目录 ----------------
      # 拷贝清单 + 索引白名单 + 硬自检都在 tools/pack_app.ps1 里，与 e2e 共用一份。
      # 以前两处各写一遍，收紧白名单时改了两处还漏了 .gitkeep/自检，
      # 于是「现场组装」的包与真发布的包不是同一个东西，e2e 结论不可信。
      - name: 组装程序目录
        shell: pwsh
        run: |
          pwsh tools/pack_app.ps1 -Dst dist/ESCAH-Offline -Repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "程序目录组装失败" }

      # 纯代码更新包：只含程序与文档，不含 Python / 依赖 / 素材。
      # 程序内「检查程序更新」下的是它（3–5 MB），更新器按白名单覆盖即可。
      - name: 组装更新包（纯代码）
        shell: pwsh
        run: |
          $src = "dist/ESCAH-Offline"
          $dst = "dist/ESCAH-Offline-update"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$dst/web" | Out-Null

          Copy-Item "$src/server", "$src/tools", "$src/docs" -Destination $dst -Recurse
          # 超分引擎连同模型约 80 MB，不进「纯代码更新包」（3–5 MB 那个）
          Remove-Item "$dst/tools/realcugan" -Recurse -Force -ErrorAction SilentlyContinue
          # 启动脚本**要**带上：pack_app 拷进来的就是仓库根那一份（纯 ASCII、
          # 优先 python\python.exe、带完整性自检），便携版和源码版通用。
          # 以前这里故意不带，是因为当时便携版的 bat 由 CI 另外生成、和仓库这份
          # 行为不一致（那份不带任何自检）；生成步骤已经删掉，现在只有一份。
          # 更新器白名单也放行了「启动.bat」，老用户走"检查更新"就能拿到新版本。
          Copy-Item "$src/VERSION", "$src/README.md", "$src/NOTICE.md", "$src/LICENSE",
                    "$src/start.sh", "$src/启动.bat" -Destination $dst
          # 注意：**不能**写 `Copy-Item "$src/web" -Filter *.html -Destination ...`
          # —— -Filter 只作用于 -Path 的子项，而 -Path 是目录本身，PowerShell 会
          # 把整个 web 目录拷进 $dst/web（生成 web/web/），html 一个都进不来。
          # 实测 v1.0.0–v1.0.2 的 update 包里**没有任何 .html**，前端改动一直没送达。
          Get-ChildItem "$src/web" -Filter *.html -File |
            Copy-Item -Destination "$dst/web"
          # 调试脚本（serve.py / stop_server.ps1 / dev-*.bat）不进更新包
          Copy-Item "$src/web/assets" -Destination "$dst/web" -Recurse
          # i18n 是用户自己攒的译文（属于用户数据），更新包里不带，
          # 否则会把用户后来的翻译覆盖回发布时的旧版
          Remove-Item "$dst/web/assets/i18n" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$src/web/data" -Destination "$dst/web" -Recurse   # 只有索引，没有剧情正文

          $n = (Get-ChildItem $dst -Recurse -File | Measure-Object).Count
          "更新包内容：$n 个文件"


      # ---------------- 超分引擎：Real-CUGAN (ncnn/Vulkan) ----------------
      # 「全量包」必须自带超分引擎，否则用户只能拿到内置 Lanczos（纯插值，
      # 2 倍只是像素变多、不增细节）。
      # 用的就是本地那条已验证的链路：realcugan-ncnn-vulkan，
      # 参数与 _manifest_analysis/_scripts/sr.py 一致（-m models-se -n 2 -s 2）。
      # 位置很关键：必须在**打包更新包之后**做，否则 ~80 MB 的模型会被塞进
      # 那个本来只有 3–5 MB 的纯代码更新包。
      - name: 内置超分引擎（Real-CUGAN）
        shell: pwsh
        run: |
          $dst = "dist/ESCAH-Offline/tools/realcugan"
          $zip = "_tools/realcugan-ncnn-vulkan-windows.zip"
          if (-not (Test-Path $zip)) {
            # 项目里那份在 _tools/ 下但不入库，CI 现下同一版本（20220728）
            $zip = "dist/realcugan.zip"
            $url = "https://github.com/nihui/realcugan-ncnn-vulkan/releases/download/20220728/realcugan-ncnn-vulkan-20220728-windows.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
          }
          Expand-Archive $zip -DestinationPath "dist/realcugan" -Force
          $exe = Get-ChildItem "dist/realcugan" -Recurse -Filter "realcugan-ncnn-vulkan.exe" |
                   Select-Object -First 1
          if (-not $exe) { throw "压缩包里没找到 realcugan-ncnn-vulkan.exe" }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item (Join-Path $exe.Directory.FullName "*") $dst -Recurse -Force
          if (-not (Test-Path "$dst/realcugan-ncnn-vulkan.exe")) {
            throw "超分引擎没有正确放进包内"
          }
          if (-not (Test-Path "$dst/models-se")) { throw "超分模型目录缺失（models-se）" }
          $mb = [math]::Round(((Get-ChildItem $dst -Recurse -File |
                   Measure-Object Length -Sum).Sum / 1MB), 1)
          "Real-CUGAN 已内置：$mb MB"

      # ---------------- 便携版：内置 Python + Pillow ----------------
      - name: 组装便携版（embedded Python）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $pyVer = "3.11.9"
          $src = "dist/ESCAH-Offline"
          $dst = "dist/ESCAH-Offline-portable"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item $src $dst -Recurse

          # 官方 embeddable 包：无 pip、体积小，正好适合"解压即用"
          $url = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "dist/py.zip"
          Expand-Archive "dist/py.zip" -DestinationPath "$dst/python" -Force

          # embeddable 版默认不加载 site-packages，要手动打开
          # 关键：embeddable 版自带 python*._pth，一旦存在就会**接管 sys.path**，
          # 其中 "." 指的是 python.exe 所在目录（python\），而不是项目根，
          # 于是 `python -m server` 报 "No module named server"。
          # 只取消注释 import site 没用 —— 必须把这个文件删掉，回到标准路径规则。
          Get-ChildItem "$dst/python/python*._pth" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Remove-Item $_.FullName -Force
              Write-Host "已删除 $($_.Name)（改为标准 sys.path）"
            }

          # 用 runner 上的 3.11 装全部运行依赖，ABI 与 embeddable 一致。
          # 这一步是整个便携版的关键：解包 Unity 资源需要 UnityPy + lz4 + numpy，
          # 缺任何一个用户都会卡在"安装剧情"这一步。
          New-Item -ItemType Directory -Force -Path "$dst/python/Lib/site-packages" | Out-Null
          python -m pip install --quiet --upgrade --target "$dst/python/Lib/site-packages" `
            --only-binary=:all: UnityPy lz4 Pillow numpy cryptography playwright av

          # 便携版的启动脚本 = **仓库根目录那一份**（pack_app 已经把 *.bat 拷进来了）。
          #
          # 以前这里用 here-string 又生成了一份「只调内置解释器」的版本，
          # 结果两份脚本行为不一致：生成的那份**没有任何自检** —— 用户把 bat
          # 单独拷到桌面、或直接在压缩包里双击时，只会看到一句
          #   D:\python\python.exe: No module named server
          # 完全不知道该怎么办（实测反馈）。
          #
          # 仓库那份已经改成：先断言 server\ 与 web\ 完整 → 再挑解释器
          # （优先 python\python.exe）→ 失败时给出可照做的提示，
          # 便携版与源码版共用同一份，不再有漂移。
          if (-not (Test-Path "$dst/启动.bat")) {
            throw "便携包缺少 启动.bat（pack_app 没拷进来？）"
          }
          $batLen = (Get-Item "$dst/启动.bat").Length
          if ($batLen -lt 1500) {
            throw "启动.bat 体积异常（$batLen 字节），可能拷到了旧版本"
          }
          # 内容断言：必须优先用内置解释器。少了这一句，用户双击就会掉到系统
          # Python，报出 "D:\python\python.exe: No module named server" 这种看不懂的错。
          $bat = Get-Content "$dst/启动.bat" -Raw -Encoding UTF8
          if ($bat -notmatch '%~dp0python') {
            throw "启动.bat 没有优先使用内置 Python（找不到 %~dp0python）"
          }
          # 提示文案必须一起进包，否则 bat 里的 type 打不出来（只剩英文兜底）
          foreach ($m in 'no_server', 'no_python') {
            if (-not (Test-Path "$dst/tools/msg/$m.txt")) {
              throw "便携包缺少提示文案 tools/msg/$m.txt"
            }
          }
          "启动.bat 已就位：$batLen 字节（优先内置 Python，提示文案齐全）"

          # 验证内置解释器 + 全部依赖都能跑（这是便携版唯一的验收点）
          & "$dst/python/python.exe" -c "import sys, UnityPy, lz4, PIL, numpy, playwright; print('embedded python', sys.version.split()[0], '| UnityPy', UnityPy.__version__, '| Pillow', PIL.__version__, '| numpy', numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "便携版 Python 环境不可用（解包依赖缺失）" }

          # 关键自检：**在项目根能 import server**。
          # 若 embeddable 的 ._pth 没删干净，`python -m server` 会报
          # "No module named server"，用户双击 启动.bat 直接失败。
          # 在这里拦下，避免把起不来的包发出去。
          # 注意：Push-Location 之后当前目录变了，$dst 是相对路径会找不到，
          # 所以**先取绝对路径**再切换目录（上一版就是踩了这个坑导致构建中止）。
          $pyExe = (Resolve-Path "$dst/python/python.exe").Path
          Push-Location $dst
          & $pyExe -c "import server; print('import server ok')"
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "便携包自检失败：找不到 server 包（._pth 未删除？）" }

          # 上面那条 import 会在便携包里留下 server/__pycache__/*.pyc —— 别打进 zip。
          # 只清 server 的：python/Lib/site-packages 里的 .pyc 是 pip 装依赖的产物，
          # 留着反而能让首次启动快一点，删了纯属浪费。
          Get-ChildItem "$dst/server" -Recurse -Directory -Filter '__pycache__' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      # CI runner 是 UTC，zip 里存的就是 UTC 时间 —— 于是用户看到的「10-31 22:36」
      # 其实是北京时间「11-01 06:36」，正好是这次 tag 的提交/构建时刻，
      # 但每个版本都要被问一遍"包里的文件是不是旧的"。这里统一改成东八区。
      # 只是给人看的元数据 → continue-on-error，绝不能因此让发布失败。
      - name: 统一包内文件时间（UTC → 东八区）
        continue-on-error: true
        shell: pwsh
        run: |
          $epoch = [int64](git log -1 --format=%ct)
          $t = ([DateTimeOffset]::FromUnixTimeSeconds($epoch)).ToOffset([TimeSpan]::FromHours(8)).DateTime
          $n = 0
          foreach ($d in 'dist/ESCAH-Offline-portable', 'dist/ESCAH-Offline-update') {
            if (-not (Test-Path $d)) { continue }
            Get-ChildItem $d -Recurse -File |
              Where-Object { $_.FullName -notmatch '\\python\\' } |
              ForEach-Object { try { $_.LastWriteTime = $t; $n++ } catch { } }
          }
          "已把 $n 个文件的时间改为 $t（东八区 = 提交时刻）"

      - name: 打 portable + update zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist/ESCAH-Offline-portable/* -DestinationPath "dist/ESCAH-Offline-v$v-win64-portable.zip" -CompressionLevel Optimal
          Compress-Archive -Path dist/ESCAH-Offline-update/* -DestinationPath "dist/ESCAH-Offline-v$v-update.zip" -CompressionLevel Optimal
          Get-ChildItem dist/*.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      # ---------------- 构建产物留档 ----------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: ESCAH-Offline-v${{ steps.ver.outputs.version }}
          # 明确两个成品：不要 dist/py.zip（那是下载的 embedded Python 原始压缩包）
          path: |
            dist/ESCAH-Offline-v${{ steps.ver.outputs.version }}-win64-portable.zip
            dist/ESCAH-Offline-v${{ steps.ver.outputs.version }}-update.zip

      # ---------------- 发布 ----------------
      # 说明文案放在 docs/release-notes.md（模板，{VERSION} 为占位符）。
      # 不要写进 YAML 的 PowerShell here-string：那里反引号是转义字符，
      # Markdown 里的 `userdata/` 会被当成 Unicode 转义序列，直接把构建搞挂。
      - name: 准备 Release 说明
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw -Encoding UTF8).Trim()
          $tpl = Get-Content docs/release-notes.md -Raw -Encoding UTF8
          $sha = (git rev-parse --short HEAD).Trim()
          $stamp = (Get-Date).ToUniversalTime().AddHours(8).ToString('yyyy-MM-dd HH:mm')
          Set-Content dist/notes.md -Value (($tpl -replace '\{VERSION\}', $v).TrimEnd()) -Encoding UTF8
          Add-Content dist/notes.md -Value "" -Encoding UTF8
          Add-Content dist/notes.md -Value ("> 本包构建自 main@" + $sha + "（北京时间 " + $stamp + "）") -Encoding UTF8
          "已生成 dist/notes.md（v$v，构建提交 $sha）"

      - name: 发布到 Release
        # 手动触发时可以用 publish=false 只留 Artifacts（不想动线上 Release 时用）
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $v = (Get-Content VERSION -Raw -Encoding UTF8).Trim()
          $tag = "v$v"
          $head = (git rev-parse HEAD).Trim()
          # 明确只发这两个成品（排除 dist/py.zip：那是 embedded Python 的原始压缩包）
          $files = @(
            "dist/ESCAH-Offline-v$v-win64-portable.zip",
            "dist/ESCAH-Offline-v$v-update.zip"
          ) | Where-Object { Test-Path $_ }
          if ($files.Count -lt 2) { throw "成品 zip 不全，拒绝发布" }

          # ---- tag 必须指向**这次构建用的提交** ----
          # 以前是 `git tag $tag 2>$null`（已存在就静默失败），于是同版本重发时
          # tag 还停在旧提交，`git checkout v1.0.4` 拿到的代码和包里的不是一份。
          git fetch --tags --force 2>$null | Out-Null
          $have = ""
          $ref = git rev-parse -q --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0 -and $ref) { $have = ($ref | Out-String).Trim() }

          if ($have -eq $head) {
            Write-Host "tag $tag 已指向本次构建提交 $head"
          } else {
            if ($have) {
              Write-Host "tag $tag 原来指向 $have → 改指向 $head（保证 tag 与包内容一致）"
            } else {
              Write-Host "新建 tag $tag → $head"
            }
            git tag -f $tag $head
            if ($LASTEXITCODE -ne 0) { throw "打 tag 失败" }
            git push origin "refs/tags/$tag" --force
            if ($LASTEXITCODE -ne 0) { throw "推送 tag 失败" }
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，覆盖附件并刷新说明"
            gh release upload $tag $files --clobber
            if ($LASTEXITCODE -ne 0) { throw "覆盖 Release 附件失败" }
            # 说明也要刷新，否则包换了、Release 页面还是上一次的文案
            gh release edit $tag --notes-file dist/notes.md
            if ($LASTEXITCODE -ne 0) { throw "更新 Release 说明失败" }
          } else {
            Write-Host "创建 Release $tag"
            gh release create $tag $files --title "v$v" --notes-file dist/notes.md
            if ($LASTEXITCODE -ne 0) { throw "发布 Release 失败" }
          }
          gh release view $tag
