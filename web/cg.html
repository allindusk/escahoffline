<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="assets/js/shellboot.js?v=1130a"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>超昂大战 · 角色 CG 查看</title>
<link rel="stylesheet" href="assets/css/cg.css?v=1116c">
<link rel="stylesheet" href="assets/css/mobile.css?v=1117g">
<!-- 悬停说明气泡（14px）：原生 title 只有 12px，低于全站字号下限 -->
<link rel="stylesheet" href="assets/css/tip.css?v=1116c">
</head>
<body>
<div class="layout">
  <aside id="sidebar">
    <!-- 搜索框放在角色列表正上方（和播放器一致）：
         列表在左、搜索在右会让人先往右看再往左点，很别扭 -->
    <input id="q" placeholder="搜索角色 / 事件…" autocomplete="off">
    <!-- CG 有两大类：角色 CG（384 个角色）和剧情 CG（主线/活动/其他，按剧本分组）。
         它们是不同组的东西，不能混在一起算"全部角色"，所以上面先分范围。 -->
    <div id="cgScope">
      <button data-scope="char" class="on">角色</button>
      <button data-scope="-1">主线</button>
      <button data-scope="-2">活动</button>
      <button data-scope="-3">其他</button>
    </div>
    <div id="filters">
      <!-- 选项由 common.js 的 ESC.fillSort 填（和立绘页共用一份，别在这里另写一套） -->
      <select id="sortBy"></select>
      <select id="dlFilter" title="筛选：资源状态 / 收藏">
        <option value="">全部角色</option>
        <option value="have">只看已下载</option>
        <option value="miss">只看未下载</option>
        <option value="fav">只看已收藏</option>
      </select>
    </div>
    <div id="charList"></div>
  </aside>

  <main>
    <div id="bar">
      <span id="barInfo"></span>
      <button class="primary" id="btnExportCg"
              title="把当前角色（未选角色时为全部）的 CG 打包成 zip">⬇ 导出 CG</button>
      <span class="sizes">
        <span>卡片大小</span>
        <button class="sz" data-sz="180">小</button>
        <button class="sz" data-sz="240">中</button>
        <button class="sz" data-sz="320">大</button>
        <button class="sz" data-sz="440">特大</button>
      </span>
    </div>
    <div id="grid"></div>
  </main>
</div>

<div id="lb">
  <div id="lbTop">
    <span id="lbTitle"></span>
    <span id="lbCount" style="color:var(--fg3)"></span>
    <span id="lbGroup" style="color:var(--fg3)"></span>
    <!-- 收藏当前这一组 CG（整组一张卡片，与卡片左上角的星是同一个状态） -->
    <button id="lbFav" title="收藏这一组 CG">☆ 收藏</button>
    <!-- 全屏浏览：手机上浏览器地址栏会吃掉一大截高度，进全屏才看得清细节 -->
    <button id="lbFs" title="全屏浏览 (F)">⛶ 全屏</button>
    <button id="lbClose">关闭 Esc</button>
  </div>
  <div id="lbBody">
    <button id="lbPrev" title="上一张 ←（第一张时跳上一组）">‹</button>
    <img id="lbImg" alt="">
    <button id="lbNext" title="下一张 →（最后一张时跳下一组）">›</button>
  </div>
  <div id="lbBottom"></div>
  <div id="lbHint">
    <kbd>←</kbd><kbd>→</kbd> 上一张 / 下一张（到头自动跳下一组）·
    <kbd>↑</kbd><kbd>↓</kbd> 直接换组 ·
    <kbd>Esc</kbd> 关闭
  </div>
  <!-- 全屏但转不了屏时（iOS Safari 没有 ScreenOrientation.lock）的提示；
       能自动转横屏的设备会真的横过来，这条自然不显示 -->
  <div id="lbRotTip">↻ 把手机横过来 · 画面更大</div>
</div>

<script src="data/names.js"></script>
<script src="data/charmeta.js"></script>
<script src="data/cgmap.js"></script>
<!-- 剧情清单：CG 页用它把"主线剧情 CG"里的组名显示成「主线 第N话 · 第X段」 -->
<script src="data/advindex.js"></script>
<!-- 本机媒体清单：磁盘上到底有哪些头像 / 剧情横幅（见 web/index.html 的说明） -->
<script src="data/mediaindex.js?v=11170540"
        onerror="window.__MEDIA=window.__MEDIA||null"></script>
<script src="data/imgmap.js?v=1117c"></script>
<script src="data/imgmap.x2.js?v=11170540"></script>
<script src="data/imgmap.base.js"
        onerror="window.__IMGBASE=window.__IMGBASE||{}"></script>
<script src="assets/js/tip.js?v=1116c"></script>
<script src="assets/js/common.js?v=1123b"></script>
<script src="assets/js/dialog.js?v=1117a"></script>
<script src="assets/js/mediaui.js?v=1117b1"></script>
<script src="assets/js/header.js?v=1130f"></script>
<script src="assets/js/packstate.js?v=1103a"></script>
<!-- 收藏夹 / 设置：与播放器共用同一份 localStorage（assets/js/userdata.js） -->
<script src="assets/js/userdata.js?v=1115g"></script>
<script src="assets/js/cg.js?v=1130h"></script>
<script src="assets/js/cgexport.js?v=1120a"></script>
<script src="assets/js/miniplayer.js?v=1130a"></script>
<script src="assets/js/disclaimer.js?v=1117c"></script>
<script src="assets/js/health.js?v=1117n"></script>
<script src="assets/js/mobile.js?v=1117c"></script>
<script>DISCLAIMER.auto(); HEALTH.start();</script>
</body>
</html>
