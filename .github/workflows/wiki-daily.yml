name: wiki-daily

# 每天抓一次公开 Wiki（escalationheroines.wikiru.jp）的角色信息，在 CI 里解析完，
# 把成品提交回仓库：
#   · web/data/charmeta.js          ← 客户端下载的就是这个「成品」（约 17KB）
#   · server/cdn/data/char_meta.json ← 中间表（约 63KB，构建/下次抓取保留 d 用）
#
# 客户端「更新角色信息」按多线路回退拉 web/data/charmeta.js
# （jsDelivr → raw.githubusercontent.com → gh 反代），用户侧**不需要代理**；
# 只有全部线路都拿不到时才退回直连 Wiki。
#
# 抓取只请求 2 个页面（角色一览 + ?サポーター），稀有度取自页面分节标题，
# 不逐页抓 439 个子页面。

on:
  schedule:
    - cron: '0 8 * * *'        # UTC 08:00 = 日本时间 17:00
  workflow_dispatch: {}         # 也支持手动触发

permissions:
  contents: write

concurrency:
  group: wiki-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 Wiki 角色信息
        env:
          PYTHONUTF8: '1'
        run: python tools/scrape_wiki.py

      - name: 重建 charmeta.js
        env:
          PYTHONUTF8: '1'
        run: python server/cdn/scripts/gen_charmeta.py

      - name: 有变化才提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/cdn/data/char_meta.json web/data/charmeta.js
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore(data): 每日刷新 Wiki 角色信息"
            git push
          fi
