# 角色名结构化词表（单一真相源）
#
# 设计目标：**改一处，全站一致**。
#   1. base  —— 形态基名（日→中）。同一基名的所有形态必须共享该中文译名。
#   2. prefix —— 形态前缀（日→中）。长的优先匹配。
#   3. suffix —— 形态后缀（日→中）。
#   4. alias  —— 例外：无法用「前缀+本名+后缀」拼出的名字，直接整名指定。
#
# 生成：python -m tools.gen_char_names
#   读取 data/parsed/characters/*.json 的 name + 本名行，
#   按本表拼出中文名 → 写入 glossary/characters_generated.yaml（i18n 会自动加载）。
#   生成时会校验「同一本名的所有形态是否共享同一中文本名」，不一致即报错。
#
# 手工 names.yaml 仍然优先：本表只补它没写的，不覆盖手写条目。

